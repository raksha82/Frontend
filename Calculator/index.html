<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="icon" href="https://play-lh.googleusercontent.com/vn6RQlkq_1M7vksJxFbhjIEGxZGE1CRH2c6JRi9QjembUEaIWvDL90dE9tFMKZ156Rtw1ZpzNfXzJMlcxJuc=w526-h296-rw">

</head>
<body>
    <h1>Calculator</h1>
    <div>
        <section>
            <input type="number" disabled>
        </section>
        <section>
            <button class="button-clear" onclick="clearDisplay()">C</button>
            <button class="button-symbols" onclick="appendOperation('/')">/</button>
            <button class="button-symbols" onclick="appendOperation('*')">*</button>
            <button class="button-symbols" onclick="appendOperation('-')">-</button>


            <button class="button-numbers" onclick="appendNumber('7')">7</button>
            <button class="button-numbers" onclick="appendNumber('8')">8</button>
            <button class="button-numbers" onclick="appendNumber('9')">9</button>
            <button class="button-symbols" onclick="appendOperation('+')">+</button>

            <button class="button-numbers" onclick="appendNumber('4')">4</button>
            <button class="button-numbers" onclick="appendNumber('5')">5</button>
            <button class="button-numbers" onclick="appendNumber('6')">6</button>
            <button class="button-equal" onclick="calculate()">=</button>


            <button class="button-numbers" onclick="appendNumber('1')">1</button>
            <button class="button-numbers" onclick="appendNumber('2')">2</button>
            <button class="button-numbers" onclick="appendNumber('3')">3</button>
            <button class="button-numbers" onclick="appendNumber('0')">0</button>
        </section>
    </div>
</body>
</html>
