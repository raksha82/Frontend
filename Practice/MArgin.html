<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Margin and Padding</title>
    <style>
        div{
            width: 300px;
            height: 200px;
            border: solid red 3px;
            margin-bottom: 150px;
        }

        h1{
            width: 300px;
            height: 150px;
            border: solid hotpink 3px;
            margin-top: 180px;
        }
    </style>
</head>
<body>
    <div>
        Hello
    </div>

    <h1>
        Hii Hii
    </h1>
</body>
</html>
