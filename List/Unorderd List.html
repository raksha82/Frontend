<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unordered List</title>
    <style>
        .Top{
            display: flex;
            justify-content: center;
        }

        .H{
            display: flex;
            justify-content: center;
            color: rgb(55, 0, 255);
        }

        .o1{
            width: 300px;
            height: 100%;
            border: dotted 3px red;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-right: 5px;

        }
        .o2{
            width: 300px;
            height: 100%;
            border: dotted 3px red;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-right: 5px;

        }

        .o3{
            width: 300px;
            height: 100%;
            border: dotted 3px red;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-right: 5px;

        }

        .o4{
            width: 350px;
            height: 100%;
            border: dotted 3px red;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-right: 5px;

        }
    </style>
</head>
<body>
    <h1 class="H">Unordered List</h1>
    <div class="Top">
        <div >
            <ul class="o1">
                <h2>Trees (Numbers)</h2>
                <li>Neem Tree</li>
                <li>Bamboo Tree</li>
                <li>Coconut Tree</li>
                <li>Mango Tree</li>
            </ul>
        </div>

        <div>
            <ul class="o2" type="circle">
                <h2>Flowers (Roman)</h2>
                <li>Jasmine</li>
                <li>Lily</li>
                <li>Lotus</li>
                <li>Rose</li>
            </ul>
        </div>

        <div>
            <ul class="o3" type="square">
                <h2>Colours (Alphabet)</h2>
                <li>Red</li>
                <li>Blue</li>
                <li>Green</li>
                <li>Brown</li>
            </ul>
        </div>

        
    </div>
</body>
</html>
