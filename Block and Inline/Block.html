<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Block Level Elements</title>
    <style>
     .main{
        width: 500px;
        height: 200px;
        border: dashed red 5px;
        text-align: center;
        margin-left: 500px;
        margin-top: 50px;
        padding-top: 25px;
     }

     h1{
        text-align: center;
        color: blue;
     }
    </style>
</head>
<body>
    <h1>Block-Level Elements</h1>
    <div class="main">
        <header>This is the header section</header>
        <section>This is Section Tag</section><div>Hello</div>
        <footer>This is the Footer</footer>
    </div>
</body>
</html>
