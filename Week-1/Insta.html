<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
  </head>
  <body>
    <div style="display: flex; justify-content: center">
      <div><img width="100" src="./instagram-icon.avif" /></div>
      <div
        style="
          display: flex;
          flex-direction: column;
          align-items: center;
          font-family: sans-serif;
          padding-top: 5%;
          font-size: 18px;
          width: 90%;
        "
      >
        <h1>See everyday moments</h1>
        <h1>from your close friends.</h1>
        <img
          width="700"
          src="https://static.cdninstagram.com/rsrc.php/yR/r/92ZsVHNkyvf.webp"
        />
      </div>
      <div
        style="
          display: flex;
          flex-direction: column;
          gap: 10px;
          font-family:
            system-ui,
            -apple-system,
            BlinkMacSystemFont,
            &quot;Segoe UI&quot;,
            Roboto,
            Oxygen,
            Ubuntu,
            Cantarell,
            &quot;Open Sans&quot;,
            &quot;Helvetica Neue&quot;,
            sans-serif;
          padding-top: 8%;
          width: 60%;
          padding-left: 3%;
          padding-right: 3%;
          border-left: 1px solid grey;
        "
      >
        <label>Log in to Instagram</label>
        <input
          type="email"
          placeholder="Enter your email,username or Mobile number"
        />
        <input
          style="padding: 7px"
          type="password"
          placeholder="Enter your password"
        />
        <input type="button" value="Log in" />
        <button>Forget Password</button>
        <button>Login with facebook</button>
        <button>Create new account</button>
        <img
          src="https://assets.streamlinehq.com/image/private/w_300,h_300,ar_1/f_auto/v1/icons/4/meta-230okm0xiqeacjuw0uk9ss.png/meta-fonilnmga1ocb2mrgitek.png?_a=DATAiZiuZAA0"
          alt="Meta Icon"
        />
      </div>
    </div>
  </body>
</html>
