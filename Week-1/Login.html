<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Instagram</title>
    <link
      rel="icon"
      href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQI6c5tHkhJtbrNGu5_Uxlkfw3_KNgdvnnjZSRzVYGF0Q&s=10"
    />
  </head>
  <body>
    <div style="display: flex">
      <div style="padding-left: 2%; padding-top: 2%">
        <img width="150" src="./instagram-icon.avif" alt="Instagram Icon" />
      </div>

      <div
        style="
          display: flex;
          flex-direction: column;
          font-family: monospace;
          padding-top: 8%;
          font-size: 23px;
          width: 65%;
        "
      >
        <h1>See everyday moments from your</h1>
        <h1 style="text-align: center; color: rgb(235, 8, 8)">
          Close friends.
        </h1>
        <img
          style="padding-left: 9%"
          width="550"
          src="https://static.cdninstagram.com/rsrc.php/yR/r/92ZsVHNkyvf.webp"
          alt="Instagram reels images"
        />
      </div>
      <div
        style="
          display: flex;
          flex-direction: column;
          padding-right: 80px;
          padding-top: 110px;
          padding-left: 80px;
          width: 900px;
          font-family: sans-serif;
          font-size: 20px;
          border-color: grey;
          border-left: solid grey 1px;
        "
      >
        <h2 style="margin-bottom: 40px">Log in to Instagram</h2>

        <input
          style="
            height: 55px;
            font-size: 18px;
            border-radius: 8px;
            margin-bottom: 20px;
            width: 100%;
          "
          type="email"
          placeholder="Mobile Number,username or email"
        />

        <input
          style="
            height: 55px;
            font-size: 18px;
            border-radius: 8px;
            margin-bottom: 20px;
            width: 100%;
          "
          type="password"
          placeholder="Password"
        />

        <button
          style="
            height: 55px;
            width: 100%;
            font-size: 18px;
            margin-bottom: 20px;
            background-color: #0064e0;
            border-radius: 20px;
            border: #0064e0;
            color: white;
          "
          type="submit"
        >
          Log in
        </button>

        <button
          style="
            width: 100%;
            font-size: 18px;
            margin-bottom: 100px;
            height: 45px;
            background-color: white;
            border: 0px;
          "
        >
          <b>Forgot password?</b>
        </button>

        <button
          style="
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            height: 55px;
            font-size: 18px;
            border-radius: 20px;
          "
        >
          <img
            src="./round-blue-facebook-logo-with-white-thick-border-and-long-shadow-on-a-transparent-background-free-png.webp"
            alt="facebook icon"
            height="20px"
            width="20px"
          />
          <span>Login with facebook</span>
        </button>

        <button
          style="
            color: blue;
            width: 100%;
            font-size: 18px;
            height: 55px;
            border-color: blue;
            border-radius: 20px;
          "
        >
          <b>Create new account</b>
        </button>

        <img
          style="padding-left: 45%"
          width="130"
          src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTN_aOVYEq81Fn4p2Y1caFdjlOeE0REYX4A_4-VecmcLXqU-sCQNI9UoeU&s=10"
          alt="Meta image"
        />
      </div>
    </div>
  </body>
</html>
